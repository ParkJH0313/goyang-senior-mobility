# goyang-senior-mobility/dashboard를 배포하는 구성입니다.
# 기존 서비스의 무료 플랜과 서비스 이름을 유지합니다.
services:
  - type: web
    name: goyang-medical-dashboard
    runtime: node
    plan: free
    rootDir: dashboard
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: KAKAO_JAVASCRIPT_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CHAT_DAILY_LIMIT
        value: "100"
      - key: CHAT_SESSION_LIMIT
        value: "8"
      - key: CHAT_CONCURRENCY
        value: "2"
# GEMINI_API_KEY는 발급 후 Render Environment에서 추가하고 재배포하세요.
# APP_ORIGIN 미설정 시 Render의 RENDER_EXTERNAL_URL을 사용합니다.
