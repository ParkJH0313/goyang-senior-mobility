# 이 dashboard 폴더를 저장소 루트로 올리는 구성입니다.
# 생성 시 Render 요금과 키를 직접 입력합니다. 이 파일 자체는 배포를 실행하지 않습니다.
services:
  - type: web
    name: goyang-medical-carbon
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: KAKAO_JAVASCRIPT_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CHAT_DAILY_LIMIT
        value: "100"
      - key: CHAT_SESSION_LIMIT
        value: "8"
      - key: CHAT_CONCURRENCY
        value: "2"
# GEMINI_API_KEY는 발급 후 Render Environment에서 추가하고 재배포하세요.
# APP_ORIGIN 미설정 시 Render의 RENDER_EXTERNAL_URL을 사용합니다.
